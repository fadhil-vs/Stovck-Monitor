<!DOCTYPE html>
<html lang="en" class="h-full bg-zinc-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% block title %}Stock Monitor{% endblock %}</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { padding-bottom: 5.5rem; }
    input, select, textarea { font-size: 15px !important; }
  </style>
</head>
<body class="min-h-full font-sans antialiased text-zinc-900 bg-zinc-50">

  <!-- Minimal Top Header -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-zinc-200">
    <div class="max-w-xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-7 h-7 rounded-lg bg-zinc-900 text-white flex items-center justify-center font-bold text-xs tracking-tight">
          SM
        </div>
        <a href="{{ url_for('index') }}" class="font-semibold text-zinc-900 tracking-tight text-sm">
          Stock Monitor
        </a>
      </div>
      <div class="flex items-center space-x-2">
        <a href="{{ url_for('add_sale') }}" 
           class="inline-flex items-center space-x-1.5 bg-zinc-900 hover:bg-zinc-800 text-white text-xs font-medium px-3 py-1.5 rounded-lg shadow-sm transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
          </svg>
          <span>New Sale</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Flash Messages -->
  <div class="max-w-xl mx-auto px-4 pt-3">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="p-3 mb-2 rounded-lg text-xs font-medium border flex items-center justify-between
            {% if category == 'error' %}bg-rose-50 text-rose-800 border-rose-200
            {% else %}bg-emerald-50 text-emerald-800 border-emerald-200{% endif %}">
            <span>{{ message }}</span>
            <button onclick="this.parentElement.remove()" class="text-zinc-400 hover:text-zinc-700 ml-2">&times;</button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
  </div>

  <!-- Main View Container -->
  <main class="max-w-xl mx-auto px-4 py-2">
    {% block content %}{% endblock %}
  </main>

  <!-- Clean Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-zinc-200 z-50">
    <div class="max-w-xl mx-auto grid grid-cols-3 h-14 text-xs font-medium">
      
      <!-- Sales & Bills Tab -->
      <a href="{{ url_for('index', tab='unpaid') }}" 
         class="flex flex-col items-center justify-center space-y-1 transition {% if request.endpoint == 'index' %}text-zinc-950 font-semibold{% else %}text-zinc-400 hover:text-zinc-700{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        <span class="text-[11px]">Sales</span>
      </a>

      <!-- Quick Add Sale -->
      <a href="{{ url_for('add_sale') }}" 
         class="flex flex-col items-center justify-center space-y-1 transition {% if request.endpoint == 'add_sale' %}text-zinc-950 font-semibold{% else %}text-zinc-400 hover:text-zinc-700{% endif %}">
        <div class="w-8 h-8 rounded-full bg-zinc-900 text-white flex items-center justify-center -mt-3 shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
          </svg>
        </div>
        <span class="text-[11px]">New</span>
      </a>

      <!-- Inventory / Stock -->
      <a href="{{ url_for('stock_page') }}" 
         class="flex flex-col items-center justify-center space-y-1 transition {% if request.endpoint in ['stock_page', 'edit_stock_order'] %}text-zinc-950 font-semibold{% else %}text-zinc-400 hover:text-zinc-700{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
        </svg>
        <span class="text-[11px]">Stock</span>
      </a>

    </div>
  </nav>

  {% block scripts %}{% endblock %}
</body>
</html>
