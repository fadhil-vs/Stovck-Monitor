{% extends "base.html" %}

{% block title %}New Sale — Stock Monitor{% endblock %}

{% block content %}
<div class="bg-white border border-zinc-200/90 rounded-xl p-4 shadow-xs">
  
  <div class="flex items-center justify-between border-b border-zinc-100 pb-3 mb-4">
    <div>
      <h2 class="text-sm font-semibold text-zinc-950">Record Sale</h2>
      <p class="text-[11px] text-zinc-400">Generate a new sale bill and update stock</p>
    </div>
    <a href="{{ url_for('index') }}" class="text-xs text-zinc-500 hover:text-zinc-800 transition">Cancel</a>
  </div>

  <form method="post" action="{{ url_for('add_sale') }}" class="space-y-3.5">

    <!-- Date & Serial No -->
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-[11px] font-medium text-zinc-500 uppercase tracking-wider mb-1">Date</label>
        <input type="date" name="sale_date" value="{{ today_date }}" required
               class="w-full bg-white border border-zinc-200 rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-zinc-900 focus:border-zinc-900">
      </div>
      <div>
        <label class="block text-[11px] font-medium text-zinc-500 uppercase tracking-wider mb-1">Serial No.</label>
        <input type="number" name="sl_no" value="{{ next_sl }}" required
               class="w-full bg-white border border-zinc-200 rounded-lg px-3 py-2 text-xs font-mono focus:outline-none focus:ring-1 focus:ring-zinc-900 focus:border-zinc-900">
      </div>
    </div>

    <!-- Bill No & Customer Name -->
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-[11px] font-medium text-zinc-500 uppercase tracking-wider mb-1">Bill No.</label>
        <input type="text" name="bill_no" value="{{ next_bill }}" required placeholder="BILL-0001"
               class="w-full bg-white border border-zinc-200 rounded-lg px-3 py-2 text-xs font-mono focus:outline-none focus:ring-1 focus:ring-zinc-900 focus:border-zinc-900">
      </div>
      <div>
        <label class="block text-[11px] font-medium text-zinc-500 uppercase tracking-wider mb-1">Customer</label>
        <input type="text" name="customer_name" required placeholder="Customer name" autofocus
               class="w-full bg-white border border-zinc-200 rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-zinc-900 focus:border-zinc-900">
      </div>
    </div>

    <!-- Product Selection -->
    <div>
      <label class="block text-[11px] font-medium text-zinc-500 uppercase tracking-wider mb-1">Product</label>
      {% if stock_items %}
        <div class="mb-1.5">
          <select id="product_select" onchange="fillProduct(this.value)"
                  class="w-full bg-zinc-50 border border-zinc-200 rounded-lg px-3 py-2 text-xs text-zinc-700 focus:outline-none focus:ring-1 focus:ring-zinc-900">
            <option value="">Select from inventory or enter custom below</option>
            {% for item in stock_items %}
              <option value="{{ item.product_name }}">{{ item.product_name }} ({{ item.quantity }} in stock)</option>
            {% endfor %}
          </select>
        </div>
      {% endif %}
      <input type="text" name="product_name" id="product_input" required placeholder="Enter product name"
             class="w-full bg-white border border-zinc-200 rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-zinc-900 focus:border-zinc-900">
    </div>

    <!-- Quantity & Amount -->
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-[11px] font-medium text-zinc-500 uppercase tracking-wider mb-1">Quantity</label>
        <input type="number" name="qty" value="1" min="1" required
               class="w-full bg-white border border-zinc-200 rounded-lg px-3 py-2 text-xs font-mono focus:outline-none focus:ring-1 focus:ring-zinc-900 focus:border-zinc-900">
      </div>
      <div>
        <label class="block text-[11px] font-medium text-zinc-500 uppercase tracking-wider mb-1">Total Amount ({{ currency }})</label>
        <input type="number" name="amount" step="0.01" min="0" required placeholder="0.00"
               class="w-full bg-white border border-zinc-200 rounded-lg px-3 py-2 text-xs font-mono font-semibold text-zinc-900 focus:outline-none focus:ring-1 focus:ring-zinc-900 focus:border-zinc-900">
      </div>
    </div>

    <!-- Payment Status Options -->
    <div>
      <label class="block text-[11px] font-medium text-zinc-500 uppercase tracking-wider mb-1.5">Payment Status</label>
      <div class="grid grid-cols-3 gap-2">
        <label class="flex items-center justify-center p-2 rounded-lg border border-zinc-200 bg-white cursor-pointer text-xs transition has-[:checked]:border-rose-400 has-[:checked]:bg-rose-50/50 has-[:checked]:text-rose-800">
          <input type="radio" name="status" value="unpaid" checked class="mr-1.5 accent-rose-600">
          <span class="font-medium">Unpaid</span>
        </label>

        <label class="flex items-center justify-center p-2 rounded-lg border border-zinc-200 bg-white cursor-pointer text-xs transition has-[:checked]:border-emerald-400 has-[:checked]:bg-emerald-50/50 has-[:checked]:text-emerald-800">
          <input type="radio" name="status" value="paid" class="mr-1.5 accent-emerald-600">
          <span class="font-medium">Paid</span>
        </label>

        <label class="flex items-center justify-center p-2 rounded-lg border border-zinc-200 bg-white cursor-pointer text-xs transition has-[:checked]:border-zinc-800 has-[:checked]:bg-zinc-100 has-[:checked]:text-zinc-900">
          <input type="radio" name="status" value="other" class="mr-1.5 accent-zinc-800">
          <span class="font-medium">Not Dealing</span>
        </label>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="pt-2">
      <button type="submit" 
              class="w-full bg-zinc-900 hover:bg-zinc-800 active:bg-zinc-950 text-white font-medium py-2.5 rounded-lg text-xs shadow-xs transition">
        Save Sale
      </button>
    </div>

  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  function fillProduct(val) {
    if (val) {
      document.getElementById('product_input').value = val;
    }
  }
</script>
{% endblock %}
